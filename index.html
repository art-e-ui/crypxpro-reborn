    <!-- Structured Data (JSON-LD) for Rich Search Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://crypxpro.com/#website",

          "description": "Next-Generation Cryptocurrency Spot, Perpetual Futures, and Staking Earn Platform",
          "publisher": {
            "@id": "https://crypxpro.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://crypxpro.com/app/market?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://crypxpro.com/#organization",
          "name": "CrypX-Pro",
          "url": "https://crypxpro.com/",
          "logo": "https://crypxpro.com/logo-full-highres.png",
          "sameAs": [
            "https://twitter.com/CrypXPro"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "admin@crypxpro.com",
            "contactType": "customer service"
          }
        },
        {
          "@type": "SoftwareApplication",
          "name": "CrypX-Pro Spot & Futures Trading Hub",
          "operatingSystem": "Web, Android, iOS",
          "applicationCategory": "FinanceApplication",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },

            "Flexible and Locked Earn Staking Vaults with daily compounded APY",
            "Real-time institutional candlestick charts and multi-asset depth scanner"
          ]
        }
      ]
    }
    </script>
